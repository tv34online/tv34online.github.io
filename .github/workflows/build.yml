name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
        with: { packages: "platforms;android-34 build-tools;34.0.0" }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: "8.7" }
      - name: Create project
        run: |
          mkdir -p iptv-app && cd iptv-app
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "IPTV-TV"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Xmx2g
          org.gradle.daemon=false
          EOF
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.tv34.iptv"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.tv34.iptv"
                  minSdk = 21; targetSdk = 34
                  versionCode = 1; versionName = "1.0"
              }
              lint { checkReleaseBuilds = false; abortOnError = false }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-ktx:1.9.0")
              implementation("androidx.recyclerview:recyclerview:1.3.2")
              implementation("androidx.media3:media3-exoplayer:1.3.1")
              implementation("androidx.media3:media3-exoplayer-hls:1.3.1")
              implementation("androidx.media3:media3-ui:1.3.1")
              implementation("io.coil-kt:coil:2.6.0")
          }
          EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <application
                  android:label="@string/app_name"
                  android:icon="@drawable/banner"
                  android:banner="@drawable/banner"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity android:name=".PlayerActivity" android:exported="false"
                      android:configChanges="orientation|screenSize|keyboardHidden" />
              </application>
          </manifest>
          EOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">IPTV</string></resources>
          EOF
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/bg_item.xml <<'EOF'
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:state_focused="true"><shape><solid android:color="#3D5AFE"/><corners android:radius="12dp"/></shape></item>
              <item><shape><solid android:color="#22FFFFFF"/><corners android:radius="12dp"/></shape></item>
          </selector>
          EOF
          mkdir -p app/src/main/res/layout
          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:background="#101018">
              <androidx.recyclerview.widget.RecyclerView android:id="@+id/list"
                  android:layout_width="match_parent" android:layout_height="match_parent"
                  android:padding="32dp" android:clipToPadding="false" />
              <TextView android:id="@+id/status" android:layout_width="wrap_content"
                  android:layout_height="wrap_content" android:layout_gravity="center"
                  android:textColor="#FFFFFF" android:textSize="20sp" android:gravity="center" />
          </FrameLayout>
          EOF
          mkdir -p app/src/main/res/layout
          cat > app/src/main/res/layout/item_channel.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="wrap_content"
              android:layout_margin="6dp" android:orientation="vertical" android:gravity="center"
              android:padding="12dp" android:focusable="true" android:clickable="true"
              android:background="@drawable/bg_item">
              <ImageView android:id="@+id/logo" android:layout_width="72dp" android:layout_height="72dp"
                  android:scaleType="fitCenter" />
              <TextView android:id="@+id/name" android:layout_width="match_parent"
                  android:layout_height="wrap_content" android:layout_marginTop="8dp"
                  android:gravity="center" android:maxLines="2" android:ellipsize="end"
                  android:textColor="#FFFFFF" android:textSize="16sp" />
          </LinearLayout>
          EOF
          mkdir -p app/src/main/java/com/tv34/iptv
          cat > app/src/main/java/com/tv34/iptv/Playlist.kt <<'EOF'
          package com.tv34.iptv

          import android.content.Context
          import java.io.File
          import java.net.HttpURLConnection
          import java.net.URL

          data class Channel(val name: String, val url: String, val logo: String?, val group: String?)

          object Store { var list: List<Channel> = emptyList() }

          object Playlist {
              // Встроенный плейлист
              const val URL_M3U = "https://tv34onlone.github.io/m3u/playlist.m3u"

              fun load(ctx: Context): List<Channel> {
                  val cache = File(ctx.filesDir, "playlist.m3u")
                  val text = try {
                      val c = URL(URL_M3U).openConnection() as HttpURLConnection
                      c.connectTimeout = 10000; c.readTimeout = 15000
                      if (c.responseCode !in 200..299) throw IllegalStateException("HTTP ${c.responseCode}")
                      c.inputStream.bufferedReader().use { it.readText() }.also { cache.writeText(it) }
                  } catch (e: Exception) {
                      if (cache.exists()) cache.readText() else throw e
                  }
                  return parse(text)
              }

              fun parse(text: String): List<Channel> {
                  val out = ArrayList<Channel>()
                  var name: String? = null; var logo: String? = null; var group: String? = null
                  val attr = { l: String, k: String -> Regex("""$k="([^"]*)"""").find(l)?.groupValues?.get(1) }
                  for (raw in text.lineSequence()) {
                      val l = raw.trim()
                      when {
                          l.startsWith("#EXTINF") -> {
                              name = l.substringAfterLast(",").trim()
                              logo = attr(l, "tvg-logo"); group = attr(l, "group-title")
                          }
                          l.isNotEmpty() && !l.startsWith("#") && name != null -> {
                              out.add(Channel(name!!, l, logo?.ifBlank { null }, group)); name = null
                          }
                      }
                  }
                  return out
              }
          }
          EOF
          mkdir -p app/src/main/java/com/tv34/iptv
          cat > app/src/main/java/com/tv34/iptv/MainActivity.kt <<'EOF'
          package com.tv34.iptv

          import android.content.Intent
          import android.os.Bundle
          import android.view.LayoutInflater
          import android.view.View
          import android.view.ViewGroup
          import android.widget.ImageView
          import android.widget.TextView
          import androidx.activity.ComponentActivity
          import androidx.recyclerview.widget.GridLayoutManager
          import androidx.recyclerview.widget.RecyclerView
          import coil.load
          import kotlin.concurrent.thread

          class MainActivity : ComponentActivity() {
              private lateinit var list: RecyclerView
              private lateinit var status: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  list = findViewById(R.id.list); status = findViewById(R.id.status)
                  list.layoutManager = GridLayoutManager(this, 5)
                  status.text = "Загрузка плейлиста…"
                  thread {
                      val r = runCatching { Playlist.load(this) }
                      runOnUiThread {
                          r.onSuccess { ch ->
                              Store.list = ch
                              if (ch.isEmpty()) { status.text = "Плейлист пуст"; return@onSuccess }
                              status.visibility = View.GONE
                              list.adapter = Adapter(ch) { i ->
                                  startActivity(Intent(this, PlayerActivity::class.java).putExtra("i", i))
                              }
                              list.requestFocus()
                          }.onFailure {
                              status.text = "Не удалось загрузить плейлист\n${it.message}"
                          }
                      }
                  }
              }

              class Adapter(val items: List<Channel>, val onClick: (Int) -> Unit) :
                  RecyclerView.Adapter<Adapter.VH>() {
                  class VH(v: View) : RecyclerView.ViewHolder(v) {
                      val logo: ImageView = v.findViewById(R.id.logo)
                      val name: TextView = v.findViewById(R.id.name)
                  }
                  override fun onCreateViewHolder(p: ViewGroup, t: Int) =
                      VH(LayoutInflater.from(p.context).inflate(R.layout.item_channel, p, false))
                  override fun getItemCount() = items.size
                  override fun onBindViewHolder(h: VH, i: Int) {
                      h.name.text = items[i].name
                      h.logo.load(items[i].logo)
                      h.itemView.setOnClickListener { onClick(i) }
                  }
              }
          }
          EOF
          mkdir -p app/src/main/java/com/tv34/iptv
          cat > app/src/main/java/com/tv34/iptv/PlayerActivity.kt <<'EOF'
          package com.tv34.iptv

          import android.os.Bundle
          import android.view.KeyEvent
          import android.view.WindowManager
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.media3.common.MediaItem
          import androidx.media3.common.PlaybackException
          import androidx.media3.common.Player
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.ui.PlayerView

          class PlayerActivity : ComponentActivity() {
              private lateinit var view: PlayerView
              private lateinit var player: ExoPlayer
              private var index = 0

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  view = PlayerView(this); setContentView(view)
                  player = ExoPlayer.Builder(this).build()
                  view.player = player
                  player.addListener(object : Player.Listener {
                      override fun onPlayerError(e: PlaybackException) {
                          Toast.makeText(this@PlayerActivity, "Канал недоступен", Toast.LENGTH_SHORT).show()
                      }
                  })
                  index = intent.getIntExtra("i", 0)
                  play()
              }

              private fun play() {
                  val ch = Store.list.getOrNull(index) ?: return finish()
                  Toast.makeText(this, ch.name, Toast.LENGTH_SHORT).show()
                  player.setMediaItem(MediaItem.fromUri(ch.url)); player.prepare(); player.playWhenReady = true
              }

              private fun step(d: Int) {
                  if (Store.list.isEmpty()) return
                  index = (index + d + Store.list.size) % Store.list.size; play()
              }

              override fun dispatchKeyEvent(e: KeyEvent): Boolean {
                  if (e.action == KeyEvent.ACTION_DOWN) when (e.keyCode) {
                      KeyEvent.KEYCODE_CHANNEL_UP, KeyEvent.KEYCODE_PAGE_UP -> { step(1); return true }
                      KeyEvent.KEYCODE_CHANNEL_DOWN, KeyEvent.KEYCODE_PAGE_DOWN -> { step(-1); return true }
                      KeyEvent.KEYCODE_DPAD_UP -> if (!view.isControllerFullyVisible) { step(1); return true }
                      KeyEvent.KEYCODE_DPAD_DOWN -> if (!view.isControllerFullyVisible) { step(-1); return true }
                  }
                  return super.dispatchKeyEvent(e)
              }

              override fun onDestroy() { player.release(); super.onDestroy() }
          }
          EOF
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/banner.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="320dp" android:height="180dp" android:viewportWidth="320" android:viewportHeight="180">
              <path android:fillColor="#2B3FD6" android:pathData="M0,0h320v180h-320z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M160,90m-44,0a44,44 0 1,1 88,0a44,44 0 1,1 -88,0"/>
              <path android:fillColor="#2B3FD6" android:pathData="M148,66L148,114L186,90z"/>
          </vector>
          EOF
      - name: Build unsigned APK
        working-directory: iptv-app
        run: |
          set -o pipefail
          gradle assembleRelease -x lintVitalAnalyzeRelease -x lintVitalReportRelease -x lintVitalRelease --no-daemon --console=plain --stacktrace 2>&1 | tee build.log
      - name: Last lines of log (on failure)
        if: failure()
        working-directory: iptv-app
        run: grep -n -i -B2 -A12 "What went wrong" build.log | head -60 || tail -40 build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iptv-unsigned-apk
          path: |
            iptv-app/app/build/outputs/apk/release/*.apk
            iptv-app/build.log