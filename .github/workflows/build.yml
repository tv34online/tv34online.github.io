name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: "8.7" }
      - name: Debug APK (подписан отладочным ключом, ставится сразу)
        run: gradle assembleDebug --no-daemon
      - name: Release APK (только если добавлены секреты с вашей подписью)
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/my.jks"
            KS_PATH="$RUNNER_TEMP/my.jks" gradle assembleRelease --no-daemon
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: iptv-apk
          path: app/build/outputs/apk/**/*.apk