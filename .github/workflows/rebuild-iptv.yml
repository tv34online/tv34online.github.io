name: Rebuild playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - playlist_source.m3u
      - scripts/**
      - config/**
      - tests/**
      - .github/workflows/rebuild-playlist.yml

# Минимально необходимые права: чтение кода и запись коммита с результатом.
permissions:
  contents: write

# Один запуск за раз; новые ждут в очереди, а не отменяют идущий (публикация не прерывается).
concurrency:
  group: rebuild-playlist
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check required files
        run: |
          missing=0
          for f in playlist_source.m3u scripts/rebuild_playlist.py config/providers.json tests/test_rebuild_playlist.py; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::Обязательный файл отсутствует: $f"
              missing=1
            fi
          done
          exit $missing

      - name: Check Python syntax
        run: python -m py_compile scripts/rebuild_playlist.py tests/test_rebuild_playlist.py

      - name: Validate config JSON
        run: |
          python -c "import json; json.load(open('config/providers.json', encoding='utf-8')); print('config OK')"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Rebuild playlist
        run: |
          python scripts/rebuild_playlist.py \
            --source playlist_source.m3u \
            --output playlist.m3u \
            --report playlist-report.json \
            --config config/providers.json

      - name: Verify outputs
        run: |
          python scripts/rebuild_playlist.py --verify-only \
            --source playlist_source.m3u \
            --output playlist.m3u \
            --report playlist-report.json \
            --config config/providers.json

      - name: Job summary
        if: always()
        run: |
          if [ -f playlist-report.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open("playlist-report.json", encoding="utf-8"))
          print(f"### Статус: `{r.get('status')}`")
          for k, v in (r.get("summary") or {}).items():
              print(f"- {k}: {v}")
          for e in r.get("errors", []):
              print(f"- **ошибка:** {e}")
          PY
          else
            echo "Отчёт не создан" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playlist-report
          path: |
            playlist-report.json
            playlist.m3u
          if-no-files-found: ignore
          retention-days: 14

      # Публикация без rebase/merge/reset: берём СВЕЖИЙ origin/main во временном worktree,
      # кладём туда только два сгенерированных файла и пушим fast-forward.
      # Если main успел измениться — повторяем с новым origin/main (до 5 раз).
      - name: Publish playlist.m3u and playlist-report.json to main
        if: success() && github.ref == 'refs/heads/main'
        run: |
          set -u
          out="$RUNNER_TEMP/generated"
          mkdir -p "$out"
          cp playlist.m3u playlist-report.json "$out/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            wt="$RUNNER_TEMP/publish-$attempt"
            git worktree add --quiet --detach "$wt" origin/main
            cp "$out/playlist.m3u" "$out/playlist-report.json" "$wt/"
            (
              cd "$wt"
              git add playlist.m3u playlist-report.json
              if git diff --cached --quiet; then
                echo "Изменений нет, публиковать нечего."
                exit 10
              fi
              git commit --quiet -m "chore: update playlist and report [skip ci]"
              git push origin HEAD:main
            ) 2>&1 | tee "$RUNNER_TEMP/push.log"
            rc=${PIPESTATUS[0]}
            git worktree remove --force "$wt" || true

            if [ "$rc" -eq 0 ]; then echo "Опубликовано (попытка $attempt)."; exit 0; fi
            if [ "$rc" -eq 10 ]; then exit 0; fi

            if grep -qiE "GH006|protected branch|permission to .* denied|403|not allowed" "$RUNNER_TEMP/push.log"; then
              echo "::error::Push в main запрещён. Проверьте Settings → Actions → General → Workflow permissions («Read and write permissions») и правила защиты ветки main (разрешите github-actions[bot] обход или отключите обязательные PR/проверки для этого пути)."
              exit 1
            fi
            echo "Push отклонён (main изменился), повтор $attempt/5 на свежем origin/main..."
            sleep $((attempt * 3))
          done
          echo "::error::Не удалось опубликовать результат за 5 попыток"
          exit 1