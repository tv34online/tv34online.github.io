name: Rebuild IPTV playlist

on:
workflow_dispatch:

schedule:
- cron: "17 */6 * * *"

push:
branches:
- main
paths:
- "playlist_source.m3u"
- "scripts/rebuild_playlist.py"
- "config/providers.json"
- ".github/workflows/rebuild-playlist.yml"

permissions:
contents: write

concurrency:
group: rebuild-iptv-playlist
cancel-in-progress: false

jobs:
rebuild:
name: Check and repair IPTV streams
runs-on: ubuntu-latest
timeout-minutes: 30

steps:
  - name: Checkout main branch
    uses: actions/checkout@v4
    with:
      ref: main
      fetch-depth: 0

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Validate project files
    shell: bash
    run: |
      set -euo pipefail

      for file in \
        playlist_source.m3u \
        scripts/rebuild_playlist.py \
        config/providers.json
      do
        if [ ! -s "$file" ]; then
          echo "::error::Required file is missing or empty: $file"
          exit 1
        fi
      done

      python -m json.tool config/providers.json >/dev/null
      python -m py_compile scripts/rebuild_playlist.py

      echo "Project files validated."

  - name: Check and repair playlist
    shell: bash
    run: |
      set -euo pipefail

      python -u scripts/rebuild_playlist.py \
        --input playlist_source.m3u \
        --source-url "https://raw.githubusercontent.com/Dimonovich/TV/Dimonovich/FREE/TV" \
        --output playlist.m3u \
        --report playlist-report.json \
        --config config/providers.json \
        --check

  - name: Validate generated playlist and report
    shell: bash
    run: |
      set -euo pipefail

      if [ ! -s playlist.m3u ]; then
        echo "::error::Generated playlist is missing or empty."
        exit 1
      fi

      if [ ! -s playlist-report.json ]; then
        echo "::error::Generated report is missing or empty."
        exit 1
      fi

      head -n 1 playlist.m3u | grep -q '^#EXTM3U' || {
        echo "::error::Generated playlist does not start with #EXTM3U."
        exit 1
      }

      python -m json.tool playlist-report.json >/dev/null

      echo "Generated playlist and report validated."

  - name: Upload report artifact
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: playlist-report
      path: playlist-report.json
      if-no-files-found: warn
      retention-days: 14

  - name: Publish generated files
    if: success()
    shell: bash
    run: |
      set -euo pipefail

      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Save outputs outside the Git working tree.
      cp playlist.m3u /tmp/generated-playlist.m3u
      cp playlist-report.json /tmp/generated-playlist-report.json

      # Start from the latest main branch.
      git fetch origin main
      git reset --hard origin/main

      # Restore the generated outputs.
      cp /tmp/generated-playlist.m3u playlist.m3u
      cp /tmp/generated-playlist-report.json playlist-report.json

      git add playlist.m3u playlist-report.json

      if git diff --cached --quiet; then
        echo "Generated files have no changes."
        exit 0
      fi

      git commit -m "Update repaired IPTV playlist"

      # Retry if another commit reaches main concurrently.
      for attempt in 1 2 3; do
        if git push origin HEAD:main; then
          echo "Successfully published playlist.m3u and playlist-report.json."
          exit 0
        fi

        if [ "$attempt" -lt 3 ]; then
          echo "Push failed. Refreshing main and retrying."

          git fetch origin main
          git reset --hard origin/main

          cp /tmp/generated-playlist.m3u playlist.m3u
          cp /tmp/generated-playlist-report.json playlist-report.json

          git add playlist.m3u playlist-report.json

          if ! git diff --cached --quiet; then
            git commit -m "Update repaired IPTV playlist"
          fi
        fi
      done

      echo "::error::Failed to publish after three attempts."
      exit 1