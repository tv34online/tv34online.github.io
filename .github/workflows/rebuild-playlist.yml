name: Rebuild IPTV playlist

on:
  workflow_dispatch:

  push:
    paths:
      - "playlist_source.m3u"
      - "scripts/rebuild_playlist.py"
      - "config/providers.json"
      - ".github/workflows/rebuild-playlist.yml"

  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: rebuild-iptv-playlist
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate required files
        run: |
          set -e

          test -s playlist_source.m3u || {
            echo "::error::playlist_source.m3u is missing or empty"
            exit 1
          }

          test -s scripts/rebuild_playlist.py || {
            echo "::error::scripts/rebuild_playlist.py is missing or empty"
            exit 1
          }

          test -s config/providers.json || {
            echo "::error::config/providers.json is missing or empty"
            exit 1
          }

          python -m json.tool config/providers.json > /dev/null

          echo "All required files exist."

      - name: Check and repair IPTV streams
        run: |
          python -u scripts/rebuild_playlist.py \
            --input playlist_source.m3u \
            --source-url "https://raw.githubusercontent.com/Dimonovich/TV/Dimonovich/FREE/TV" \
            --output playlist.m3u \
            --report playlist-report.json \
            --config config/providers.json \
            --check

      - name: Validate generated files
        if: always()
        run: |
          if [ ! -s playlist-report.json ]; then
            echo "::error::playlist-report.json was not created"
            exit 1
          fi

          echo "===== PLAYLIST REPORT ====="
          cat playlist-report.json

          if [ "${{ job.status }}" = "success" ] && [ ! -s playlist.m3u ]; then
            echo "::error::playlist.m3u was not created or is empty"
            exit 1
          fi

            - name: Commit generated playlist and report
        if: success()
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Сохраняем результаты проверки.
          cp playlist.m3u /tmp/playlist.m3u
          cp playlist-report.json /tmp/playlist-report.json

          # Получаем актуальную версию main.
          git fetch origin main

          # Переключаемся на актуальную ветку.
          git reset --hard origin/main

          # Возвращаем результаты текущей проверки.
          cp /tmp/playlist.m3u playlist.m3u
          cp /tmp/playlist-report.json playlist-report.json

          git add playlist.m3u playlist-report.json

          if git diff --cached --quiet; then
            echo "Изменений нет."
            exit 0
          fi

          git commit -m "Check and repair IPTV streams"

          # Повторяем отправку при одновременном обновлении main.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Плейлист и отчёт успешно опубликованы."
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Ветка обновилась. Повторная попытка $attempt..."
              git fetch origin main
              git reset --hard origin/main

              cp /tmp/playlist.m3u playlist.m3u
              cp /tmp/playlist-report.json playlist-report.json

              git add playlist.m3u playlist-report.json
              git diff --cached --quiet || git commit -m "Check and repair IPTV streams"
            fi
          done

          echo "::error::Не удалось отправить изменения в main после 3 попыток."
          exit 1