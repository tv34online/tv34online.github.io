name: Rebuild approved IPTV playlist

on:
  workflow_dispatch:
  push:
    paths:
      - "playlist_source.m3u"
      - "config/providers.json"
      - "scripts/rebuild_playlist.py"
      - ".github/workflows/rebuild-playlist.yml"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: playlist-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild playlist (strict provider allowlist)
        run: |
          python scripts/rebuild_playlist.py \
            --input playlist_source.m3u \
            --output playlist.m3u \
            --report playlist-report.json \
            --check

      - name: Upload report even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playlist-report
          path: playlist-report.json
          if-no-files-found: ignore

      - name: Commit changed playlist
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u playlist-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild playlist from approved providers"
            git push
          else
            echo "No playlist changes."
          fi