<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админка — Телевизор 34</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: #0b0b0e; color: #fff; padding: 20px; max-width: 480px; margin: 0 auto; }
    
    h1 { color: #ff6600; font-size: 20px; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
    
    .card { background: #14141a; padding: 20px; border-radius: 14px; border: 1px solid #222; margin-bottom: 16px; }
    
    label { display: block; font-size: 12px; color: #aaa; margin-bottom: 6px; font-weight: 600; }
    input, select {
      width: 100%; padding: 12px; background: #0b0b0e; border: 1px solid #333;
      border-radius: 8px; color: #fff; font-size: 14px; margin-bottom: 14px; outline: none; transition: border-color 0.2s;
    }
    input:focus, select:focus { border-color: #ff6600; }

    .btn {
      width: 100%; background: #ff6600; color: white; border: none; padding: 14px;
      border-radius: 8px; font-weight: 700; font-size: 15px; cursor: pointer; transition: 0.2s;
    }
    .btn:hover { background: #e65c00; }

    .status { margin-top: 12px; font-size: 13px; text-align: center; color: #888; word-break: break-all; }
  </style>
</head>
<body>

  <h1>📺 Добавить канал на TV34</h1>

  <!-- Форма добавления -->
  <div class="card">
    <label>Название канала</label>
    <input type="text" id="chName" placeholder="Например: Россия 24">

    <label>Категория</label>
    <select id="chGroup">
      <option value="Федеральные">Федеральные</option>
      <option value="Новостные">Новостные</option>
      <option value="Развлекательные">Развлекательные</option>
      <option value="Спортивные">Спортивные</option>
      <option value="Детские">Детские</option>
      <option value="Познавательные">Познавательные</option>
    </select>

    <label>Ссылка на логотип (.png/.svg)</label>
    <input type="text" id="chLogo" placeholder="https://...">

    <label>Ссылка на поток (.m3u8)</label>
    <input type="text" id="chUrl" placeholder="https://domain.com/stream.m3u8">

    <button class="btn" onclick="addChannelToGitHub()">🚀 Добавить канал в плейлист</button>
    <div class="status" id="statusText"></div>
  </div>

  <script>
    const REPO = 'tv34online/tv34online.github.io';
    const FILE_PATH = 'playlist.m3u';
    const TOKEN = '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';

    async function addChannelToGitHub() {
      const name = document.getElementById('chName').value.trim();
      const group = document.getElementById('chGroup').value;
      const logo = document.getElementById('chLogo').value.trim();
      const url = document.getElementById('chUrl').value.trim();
      const status = document.getElementById('statusText');

      if (!name || !url) { 
        alert('Пожалуйста, заполните название канала и ссылку на поток!'); 
        return; 
      }

      status.style.color = '#ff6600';
      status.innerText = 'Загрузка плейлиста с GitHub...';

      try {
        // 1. Запрашиваем текущий плейлист с GitHub
        const getRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`, {
          headers: { 'Authorization': `token ${TOKEN}` }
        });

        if (!getRes.ok) throw new Error('Не удалось получить доступ к файлу плейлиста.');

        const fileData = await getRes.json();
        const currentSha = fileData.sha;
        
        // Декодируем M3U из Base64 в текст UTF-8
        let currentText = decodeURIComponent(escape(atob(fileData.content)));

        // 2. Формируем запись для нового канала
        const newChannelText = `#EXTINF:-1 tvg-logo="${logo}" group-title="${group}",${name}\n${url}\n`;
        const updatedPlaylistText = currentText.trim() + '\n\n' + newChannelText;

        status.innerText = 'Сохранение изменений...';

        // 3. Отправляем обновленный файл обратно в GitHub
        const base64Content = btoa(unescape(encodeURIComponent(updatedPlaylistText)));

        const putRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${TOKEN}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: `Добавлен канал: ${name}`,
            content: base64Content,
            sha: currentSha
          })
        });

        if (!putRes.ok) throw new Error('Ошибка записи в репозиторий.');

        status.style.color = '#00ff88';
        status.innerText = `✅ Канал "${name}" успешно добавлен! Сайт обновится через 1-2 минуты.`;

        // Очистка полей ввода
        document.getElementById('chName').value = '';
        document.getElementById('chLogo').value = '';
        document.getElementById('chUrl').value = '';

      } catch (err) {
        status.style.color = '#ff4444';
        status.innerText = '❌ Ошибка: ' + err.message;
      }
    }
  </script>
</body>
</html>
