<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV34Online Playlist Manager</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --border: #334155;
            --text: #f8fafc;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #4ade80;
            --danger: #f87171;
        }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: var(--panel); padding: 20px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        h2 { margin-top: 0; border-bottom: 1px solid var(--border); padding-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .settings-bar, .toolbar { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; align-items: center; }
        input, select, button { background: var(--bg); color: var(--text); border: 1px solid var(--border); padding: 10px; border-radius: 6px; font-size: 14px; outline: none; }
        input[type="text"], input[type="password"] { flex: 1; min-width: 250px; }
        button { background: var(--accent); border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: var(--accent-hover); }
        button.danger { background: var(--danger); }
        .channel-card { background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border); padding: 12px; border-radius: 8px; margin-bottom: 10px; display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: center; }
        .channel-card input { width: 100%; box-sizing: border-box; }
        .status { margin-top: 15px; font-weight: bold; min-height: 20px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { padding: 8px 16px; border-radius: 6px; cursor: pointer; background: var(--bg); border: 1px solid var(--border); }
        .tab.active { background: var(--accent); border-color: var(--accent); }
        #channelsList { max-height: 500px; overflow-y: auto; padding-right: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>
        <span>Управление плейлистами GitHub</span>
        <button onclick="toggleView()" style="font-size: 12px; padding: 6px 10px;">Режим кода (Raw)</button>
    </h2>

    <!-- Настройки токена и репозитория -->
    <div class="settings-bar">
        <input type="password" id="ghToken" placeholder="Введите GitHub Token (Ghp_...)" oninput="saveSettings()">
        <input type="text" id="repoName" placeholder="Репозиторий (например: user/repo)" value="tv34online/tv34online" oninput="saveSettings()">
        <button onclick="loadPlaylist()">Загрузить с GitHub</button>
    </div>

    <!-- Выбор плейлиста -->
    <div class="tabs">
        <div class="tab active" onclick="switchPlaylist('tv/playlist.m3u')">TV</div>
        <div class="tab" onclick="switchPlaylist('ios/playlist.m3u')">iOS</div>
        <div class="tab" onclick="switchPlaylist('pc/playlist.m3u')">PC</div>
    </div>

    <div class="toolbar">
        <button onclick="addChannel()">➕ Добавить канал</button>
        <button onclick="saveToGitHub()" style="background: var(--success); color: #0f172a;">💾 Сохранить на GitHub</button>
    </div>

    <!-- Список каналов (визуальный режим) -->
    <div id="channelsList"></div>

    <!-- Режим сырого текста (скрыт по умолчанию) -->
    <textarea id="rawContent" style="width:100%; height:450px; display:none; font-family:monospace; box-sizing:border-box; background:var(--bg); color:#38bdf8; padding:10px; border-radius:6px; border:1px solid var(--border);" oninput="syncFromRaw()"></textarea>

    <div class="status" id="statusMsg"></div>
</div>

<script>
    let currentPath = 'tv/playlist.m3u';
    let channels = [];
    let fileSha = '';

    // Автозагрузка сохраненных данных при старте
    window.onload = function() {
        if (localStorage.getItem('gh_token')) document.getElementById('ghToken').value = localStorage.getItem('gh_token');
        if (localStorage.getItem('gh_repo')) document.getElementById('repoName').value = localStorage.getItem('gh_repo');
        loadPlaylist();
    };

    function saveSettings() {
        localStorage.setItem('gh_token', document.getElementById('ghToken').value);
        localStorage.setItem('gh_repo', document.getElementById('repoName').value);
    }

    function switchPlaylist(path) {
        currentPath = path;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');
        loadPlaylist();
    }

    // Загрузка файла с GitHub API
    async function loadPlaylist() {
        const token = document.getElementById('ghToken').value;
        const repo = document.getElementById('repoName').value;
        if (!token || !repo) {
            showStatus('Укажите токен и репозиторий!', 'red');
            return;
        }

        showStatus('Загрузка файла с GitHub...', '#38bdf8');
        try {
            const url = `https://api.github.com/repos/${repo}/contents/${currentPath}`;
            const res = await fetch(url, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (!res.ok) throw new Error('Ошибка загрузки. Проверьте токен и путь.');
            const data = await res.json();
            
            fileSha = data.sha;
            // Декодируем Base64 из GitHub API с поддержкой UTF-8
            const content = decodeURIComponent(escape(atob(data.content)));
            parseM3U(content);
            renderChannels();
            document.getElementById('rawContent').value = content;
            showStatus('Плейлист успешно загружен!', 'var(--success)');
        } catch (err) {
            showStatus(err.message, 'var(--danger)');
        }
    }

    // Парсинг M3U файла в массив объектов
    function parseM3U(text) {
        channels = [];
        const lines = text.split('\n');
        let currentChannel = {};

        for (let i = 0; i < lines.length; i++) {
            let line = lines[i].trim();
            if (line.startsWith('#EXTINF:')) {
                currentChannel = {};
                // Извлекаем иконку (tvg-logo="...")
                const logoMatch = line.match(/tvg-logo="([^"]*)"/);
                currentChannel.logo = logoMatch ? logoMatch[1] : '';

                // Извлекаем название канала (после запятой)
                const commaIdx = line.lastIndexOf(',');
                currentChannel.title = commaIdx !== -1 ? line.substring(commaIdx + 1) : '';
            } else if (line && !line.startsWith('#')) {
                currentChannel.url = line;
                channels.push(currentChannel);
                currentChannel = {};
            }
        }
    }

    // Генерация текста M3U из массива каналов
    function generateM3U() {
        let text = '#EXTM3U\n';
        channels.forEach(ch => {
            text += `#EXTINF:-1 tvg-logo="${ch.logo || ''}",${ch.title || 'Без названия'}\n`;
            text += `${ch.url || ''}\n`;
        });
        return text;
    }

    // Отрисовка карточек каналов
    function renderChannels() {
        const list = document.getElementById('channelsList');
        list.innerHTML = '';
        channels.forEach((ch, index) => {
            list.innerHTML += `
                <div class="channel-card">
                    <div>
                        <label style="font-size:11px; color:#94a3b8;">Название канала:</label>
                        <input type="text" value="${escapeHtml(ch.title)}" oninput="channels[${index}].title = this.value; updateRaw()">
                    </div>
                    <div>
                        <label style="font-size:11px; color:#94a3b8;">Ссылка на поток:</label>
                        <input type="text" value="${escapeHtml(ch.url)}" oninput="channels[${index}].url = this.value; updateRaw()">
                    </div>
                    <div>
                        <label style="font-size:11px; color:#94a3b8;">Иконка (лого):</label>
                        <div style="display:flex; gap:5px;">
                            <input type="text" value="${escapeHtml(ch.logo)}" oninput="channels[${index}].logo = this.value; updateRaw()">
                            <button class="danger" onclick="removeChannel(${index})">❌</button>
                        </div>
                    </div>
                </div>
            `;
        });
        updateRaw();
    }

    function updateRaw() {
        document.getElementById('rawContent').value = generateM3U();
    }

    function syncFromRaw() {
        parseM3U(document.getElementById('rawContent').value);
    }

    function addChannel() {
        channels.push({ title: 'Новый канал', url: 'http://', logo: '' });
        renderChannels();
    }

    function removeChannel(index) {
        channels.splice(index, 1);
        renderChannels();
    }

    function toggleView() {
        const list = document.getElementById('channelsList');
        const raw = document.getElementById('rawContent');
        if (list.style.display === 'none') {
            parseM3U(raw.value);
            renderChannels();
            list.style.display = 'block';
            raw.style.display = 'none';
        } else {
            raw.value = generateM3U();
            list.style.display = 'none';
            raw.style.display = 'block';
        }
    }

    // Сохранение файла обратно в GitHub через API
    async function saveToGitHub() {
        const token = document.getElementById('ghToken').value;
        const repo = document.getElementById('repoName').value;
        if (!token || !repo) {
            showStatus('Заполните токен и репозиторий!', 'var(--danger)');
            return;
        }

        showStatus('Сохранение изменений на GitHub...', '#38bdf8');
        try {
            const contentToSave = document.getElementById('rawContent').value;
            // Кодируем в Base64 с поддержкой UTF-8
            const base64Content = btoa(unescape(encodeURIComponent(contentToSave)));

            const url = `https://api.github.com/repos/${repo}/contents/${currentPath}`;
            const body = {
                message: `Update ${currentPath} via Web Editor`,
                content: base64Content,
                sha: fileSha
            };

            const res = await fetch(url, {
                method: 'PUT',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(body)
            });

            if (!res.ok) {
                const errData = await res.json();
                throw new Error(errData.message || 'Ошибка сохранения');
            }

            const data = await res.json();
            fileSha = data.content.sha; // Обновляем SHA для последующих коммитов
            showStatus('Файл успешно сохранен на GitHub!', 'var(--success)');
        } catch (err) {
            showStatus('Ошибка: ' + err.message, 'var(--danger)');
        }
    }

    function showStatus(text, color) {
        const msg = document.getElementById('statusMsg');
        msg.style.color = color;
        msg.innerText = text;
    }

    function escapeHtml(str) {
        return (str || '').replace(/"/g, '&quot;');
    }
</script>

</body>
</html>
