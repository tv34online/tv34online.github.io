<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Телевизор 34 Админ Плейлиста</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --border: #334155;
            --text: #f8fafc;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #4ade80;
            --danger: #f87171;
        }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; box-sizing: border-box; }
        .container { max-width: 1000px; margin: 0 auto; background: var(--panel); padding: 12px; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        h2 { margin: 0 0 10px 0; font-size: 16px; border-bottom: 1px solid var(--border); padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .settings-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; background: rgba(15, 23, 42, 0.4); padding: 8px; border-radius: 6px; border: 1px solid var(--border); }
        input, select, button { background: var(--bg); color: var(--text); border: 1px solid var(--border); padding: 8px; border-radius: 6px; font-size: 13px; outline: none; width: 100%; box-sizing: border-box; }
        button { background: var(--accent); border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: var(--accent-hover); }
        button.danger { background: var(--danger); }
        .toolbar { display: flex; gap: 6px; margin-bottom: 10px; }
        .channel-card { background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border); padding: 8px; border-radius: 6px; margin-bottom: 6px; display: flex; flex-direction: column; gap: 6px; }
        .status { margin-top: 8px; font-weight: bold; font-size: 12px; word-break: break-all; }
        .tabs { display: flex; gap: 4px; margin-bottom: 10px; }
        .tab { flex: 1; text-align: center; padding: 6px; border-radius: 6px; cursor: pointer; background: var(--bg); border: 1px solid var(--border); font-size: 13px; }
        .tab.active { background: var(--accent); border-color: var(--accent); }
        #channelsList { max-height: 400px; overflow-y: auto; }
        label { font-size: 11px; color: #94a3b8; }
    </style>
</head>
<body>

<div class="container">
    <h2>
        <span>TV34Manager</span>
        <button onclick="toggleView()" style="width: auto; font-size: 11px; padding: 4px 8px;">Код / Карточки</button>
    </h2>

    <!-- Настройки -->
    <div class="settings-group">
        <div>
            <label>GitHub Токен (ghp_...):</label>
            <input type="password" id="ghToken" placeholder="Вставьте токен" oninput="saveSettings()">
        </div>
        <div>
            <label>Репозиторий (владелец/проект):</label>
            <input type="text" id="repoName" placeholder="tv34online/tv34online" value="tv34online/tv34online" oninput="saveSettings()">
        </div>
        <button onclick="loadPlaylist()" style="margin-top: 4px;">Загрузить плейлист</button>
    </div>

    <!-- Выбор плейлиста -->
    <div class="tabs">
        <div class="tab active" onclick="switchPlaylist('tv/playlist.m3u', this)">TV</div>
        <div class="tab" onclick="switchPlaylist('ios/playlist.m3u', this)">iOS</div>
        <div class="tab" onclick="switchPlaylist('pc/playlist.m3u', this)">PC</div>
    </div>

    <div class="toolbar">
        <button onclick="addChannel()">➕ Добавить</button>
        <button onclick="saveToGitHub()" style="background: var(--success); color: #0f172a;">💾 Сохранить</button>
    </div>

    <!-- Список каналов -->
    <div id="channelsList"></div>

    <!-- Режим кода -->
    <textarea id="rawContent" style="width:100%; height:350px; display:none; font-family:monospace; font-size:12px; background:var(--bg); color:#38bdf8; padding:8px; border-radius:6px; border:1px solid var(--border); box-sizing:border-box;" oninput="syncFromRaw()"></textarea>

    <div class="status" id="statusMsg"></div>
</div>

<script>
    let currentPath = 'tv/playlist.m3u';
    let channels = [];
    let fileSha = '';

    window.onload = function() {
        if (localStorage.getItem('gh_token')) document.getElementById('ghToken').value = localStorage.getItem('gh_token');
        if (localStorage.getItem('gh_repo')) document.getElementById('repoName').value = localStorage.getItem('gh_repo');
        loadPlaylist();
    };

    function saveSettings() {
        localStorage.setItem('gh_token', document.getElementById('ghToken').value.trim());
        localStorage.setItem('gh_repo', document.getElementById('repoName').value.trim());
    }

    function switchPlaylist(path, element) {
        currentPath = path;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        element.classList.add('active');
        loadPlaylist();
    }

    function getCleanToken() {
        return document.getElementById('ghToken').value.trim().replace(/[\r\n\t]/g, '');
    }

    async function loadPlaylist() {
        const token = getCleanToken();
        const repo = document.getElementById('repoName').value.trim();
        if (!token || !repo) {
            showStatus('Заполните токен и репозиторий!', 'orange');
            return;
        }

        showStatus('Загрузка с GitHub...', '#38bdf8');
        try {
            const url = `https://api.github.com/repos/${repo}/contents/${currentPath}`;
            const res = await fetch(url, {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (res.status === 404) {
                // Если файла еще нет, создаем пустой шаблон
                channels = [{ title: 'Канал 1', url: 'http://', logo: '' }];
                fileSha = '';
                renderChannels();
                showStatus('Файл не найден на GitHub. Будет создан новый при сохранении.', 'orange');
                return;
            }

            if (!res.ok) throw new Error('Ошибка сети или неверный токен (Код: ' + res.status + ')');
            
            const data = await res.json();
            fileSha = data.sha;
            const content = decodeURIComponent(escape(atob(data.content)));
            parseM3U(content);
            renderChannels();
            document.getElementById('rawContent').value = content;
            showStatus('Успешно загружено!', 'var(--success)');
        } catch (err) {
            showStatus('Ошибка: ' + err.message, 'var(--danger)');
        }
    }

    function parseM3U(text) {
        channels = [];
        const lines = text.split('\n');
        let currentChannel = {};

        for (let i = 0; i < lines.length; i++) {
            let line = lines[i].trim();
            if (line.startsWith('#EXTINF:')) {
                currentChannel = {};
                const logoMatch = line.match(/tvg-logo="([^"]*)"/);
                currentChannel.logo = logoMatch ? logoMatch[1] : '';

                const commaIdx = line.lastIndexOf(',');
                currentChannel.title = commaIdx !== -1 ? line.substring(commaIdx + 1) : '';
            } else if (line && !line.startsWith('#')) {
                currentChannel.url = line;
                channels.push(currentChannel);
                currentChannel = {};
            }
        }
        if (channels.length === 0 && text.trim() !== '') {
            channels.push({ title: 'Канал', url: text, logo: '' });
        }
    }

    function generateM3U() {
        let text = '#EXTM3U\n';
        channels.forEach(ch => {
            text += `#EXTINF:-1 tvg-logo="${ch.logo || ''}",${ch.title || 'Без названия'}\n`;
            text += `${ch.url || ''}\n`;
        });
        return text;
    }

    function renderChannels() {
        const list = document.getElementById('channelsList');
        list.innerHTML = '';
        channels.forEach((ch, index) => {
            list.innerHTML += `
                <div class="channel-card">
                    <div>
                        <label>Название:</label>
                        <input type="text" value="${escapeHtml(ch.title)}" oninput="channels[${index}].title = this.value; updateRaw()">
                    </div>
                    <div>
                        <label>Ссылка:</label>
                        <input type="text" value="${escapeHtml(ch.url)}" oninput="channels[${index}].url = this.value; updateRaw()">
                    </div>
                    <div>
                        <label>Иконка (лого):</label>
                        <input type="text" value="${escapeHtml(ch.logo)}" oninput="channels[${index}].logo = this.value; updateRaw()">
                    </div>
                    <button class="danger" style="padding: 4px; font-size: 11px; width: auto;" onclick="removeChannel(${index})">Удалить канал</button>
                </div>
            `;
        });
        updateRaw();
    }

    function updateRaw() {
        document.getElementById('rawContent').value = generateM3U();
    }

    function syncFromRaw() {
        parseM3U(document.getElementById('rawContent').value);
    }

    function addChannel() {
        channels.push({ title: 'Новый канал', url: 'http://', logo: '' });
        renderChannels();
    }

    function removeChannel(index) {
        channels.splice(index, 1);
        renderChannels();
    }

    function toggleView() {
        const list = document.getElementById('channelsList');
        const raw = document.getElementById('rawContent');
        if (list.style.display === 'none') {
            parseM3U(raw.value);
            renderChannels();
            list.style.display = 'block';
            raw.style.display = 'none';
        } else {
            raw.value = generateM3U();
            list.style.display = 'none';
            raw.style.display = 'block';
        }
    }

    async function saveToGitHub() {
        const token = getCleanToken();
        const repo = document.getElementById('repoName').value.trim();
        if (!token || !repo) {
            showStatus('Заполните токен и репозиторий!', 'var(--danger)');
            return;
        }

        showStatus('Сохранение на GitHub...', '#38bdf8');
        try {
            const contentToSave = document.getElementById('rawContent').value;
            const base64Content = btoa(unescape(encodeURIComponent(contentToSave)));

            const url = `https://api.github.com/repos/${repo}/contents/${currentPath}`;
            const body = {
                message: `Update ${currentPath} via Web Editor`,
                content: base64Content
            };
            if (fileSha) body.sha = fileSha;

            const res = await fetch(url, {
                method: 'PUT',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(body)
            });

            if (!res.ok) {
                const errData = await res.json();
                throw new Error(errData.message || 'Ошибка сохранения');
            }

            const data = await res.json();
            fileSha = data.content.sha;
            showStatus('Успешно сохранено на GitHub!', 'var(--success)');
        } catch (err) {
            showStatus('Ошибка: ' + err.message, 'var(--danger)');
        }
    }

    function showStatus(text, color) {
        const msg = document.getElementById('statusMsg');
        msg.style.color = color;
        msg.innerText = text;
    }

    function escapeHtml(str) {
        return (str || '').replace(/"/g, '&quot;');
    }
</script>

</body>
</html>
