<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Телевизор 34 — Онлайн ТВ</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://yastatic.net/s3/pasport/auth-sdk/v1/auth-sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #0b0b0e; color: #ffffff; padding-bottom: 70px; overflow-x: hidden; }

    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 20px; background: rgba(11, 11, 14, 0.95);
      position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .logo { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 20px; color: #fff; text-decoration: none; }
    .logo-badge { background: linear-gradient(135deg, #ff8800, #ff4500); color: #fff; padding: 2px 8px; border-radius: 6px; font-size: 16px; }

    .container { padding: 16px; max-width: 1000px; margin: 0 auto; }

    .player-section { margin-bottom: 20px; }
    .player-wrapper {
      position: relative; width: 100%; aspect-ratio: 16/9; background: #000;
      border-radius: 16px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    video { width: 100%; height: 100%; object-fit: contain; cursor: pointer; }
    
    .player-controls {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: linear-gradient(0deg, rgba(0,0,0,0.95) 0%, transparent 100%);
      padding: 16px; display: flex; align-items: center; justify-content: space-between;
      opacity: 0; transition: opacity 0.3s ease; gap: 12px;
    }
    .player-wrapper:hover .player-controls { opacity: 1; }
    .right-controls { display: flex; align-items: center; gap: 10px; }
    .ctrl-btn { background: none; border: none; color: #fff; cursor: pointer; font-size: 18px; padding: 6px; display: flex; align-items: center; justify-content: center; }
    .now-playing { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; overflow: hidden; }
    .live-tag { background: #ff4500; color: #fff; font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; flex-shrink: 0; }

    .volume-box { display: flex; align-items: center; gap: 6px; }
    .volume-slider {
      -webkit-appearance: none; appearance: none;
      width: 70px; height: 4px; background: rgba(255,255,255,0.3);
      border-radius: 2px; outline: none; cursor: pointer; transition: 0.2s;
    }
    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 12px; height: 12px; border-radius: 50%; background: #ff6600; cursor: pointer;
    }

    .categories { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 16px; scrollbar-width: none; }
    .categories::-webkit-scrollbar { display: none; }
    .cat-chip {
      background: #181820; border: 1px solid rgba(255,255,255,0.08); color: #aaa;
      padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600;
      white-space: nowrap; cursor: pointer; transition: 0.2s;
    }
    .cat-chip.active, .cat-chip:hover { background: #ff6600; color: #fff; border-color: #ff6600; }

    .channel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
    .channel-card {
      background: #14141a; border-radius: 12px; padding: 12px; display: flex; align-items: center; gap: 12px;
      cursor: pointer; border: 1px solid rgba(255,255,255,0.05); transition: 0.2s;
    }
    .channel-card:hover, .channel-card.active { background: #1c1c24; border-color: #ff6600; transform: translateY(-2px); }
    .channel-logo { width: 50px; height: 50px; border-radius: 8px; background: #08080a; object-fit: contain; padding: 4px; }
    .channel-info { flex: 1; overflow: hidden; }
    .channel-title { font-weight: 700; font-size: 15px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .channel-epg { font-size: 12px; color: #ff6600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .epg-container { display: flex; flex-direction: column; gap: 12px; }
    .epg-card { background: #14141a; border-radius: 12px; padding: 16px; border: 1px solid rgba(255,255,255,0.05); }
    .epg-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .epg-logo { width: 32px; height: 32px; object-fit: contain; }
    .epg-item { display: flex; flex-direction: column; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.03); font-size: 13px; }
    .epg-row { display: flex; gap: 12px; align-items: center; }
    .epg-time { color: #888; font-weight: 700; min-width: 50px; }
    .epg-title { color: #ddd; flex: 1; }
    
    .epg-item.is-now { background: rgba(255, 102, 0, 0.08); border-radius: 8px; padding: 8px; margin: 4px 0; }
    .epg-item.is-now .epg-time { color: #ff6600; }
    .epg-item.is-now .epg-title { color: #ffffff; font-weight: 600; }
    .now-badge { background: #ff6600; color: #fff; font-size: 9px; font-weight: 800; padding: 2px 5px; border-radius: 4px; margin-left: 6px; text-transform: uppercase; }

    .epg-progress-bar { width: 100%; height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px; margin-top: 6px; overflow: hidden; }
    .epg-progress-fill { height: 100%; background: #ff6600; transition: width 0.3s ease; }

    .account-card {
      background: #14141a; border-radius: 16px; padding: 24px; text-align: center;
      border: 1px solid rgba(255,255,255,0.08); max-width: 400px; margin: 40px auto;
    }
    .avatar { width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 16px; border: 3px solid #ff6600; object-fit: cover; }
    .btn-yandex {
      background: #fc3f1d; color: white; border: none; padding: 12px 24px;
      border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 10px; transition: 0.2s; width: 100%; justify-content: center;
    }
    .btn-yandex:hover { background: #e03213; }
    .btn-logout { background: #282832; color: #ccc; margin-top: 12px; }

    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: 60px;
      background: rgba(18, 18, 24, 0.95); border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex; justify-content: space-around; align-items: center; backdrop-filter: blur(10px); z-index: 1000;
    }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #777; text-decoration: none; font-size: 11px; font-weight: 600; cursor: pointer; }
    .nav-item.active { color: #ff6600; }
    .nav-item svg { width: 22px; height: 22px; fill: currentColor; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body>

  <header>
    <a href="#" class="logo">
      <span>ТЕЛЕВИЗОР</span>
      <span class="logo-badge">34</span>
    </a>
  </header>

  <div class="container">
    <div id="tab-home" class="tab-content active">
      <div class="player-section">
        <div class="player-wrapper">
          <video id="videoPlayer" autoplay playsinline muted onclick="toggleMute()"></video>
          <div class="player-controls">
            <div class="now-playing">
              <span class="live-tag">LIVE</span>
              <span id="playerChannelName">Выберите канал</span>
            </div>
            
            <div class="right-controls">
              <div class="volume-box">
                <button class="ctrl-btn" id="muteBtn" onclick="toggleMute()">🔇</button>
                <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="0.8" oninput="changeVolume(this.value)">
              </div>
              <button class="ctrl-btn" onclick="toggleFullscreen()">⛶</button>
            </div>
          </div>
        </div>
      </div>

      <div class="categories" id="categoryContainer">
        <div class="cat-chip active" onclick="filterCategory('all', this)">Все каналы</div>
      </div>

      <div class="channel-grid" id="channelList"></div>
    </div>

    <div id="tab-epg" class="tab-content">
      <h2 style="margin-bottom: 16px; color: #ff6600;">Телепрограмма</h2>
      <div id="epgList" class="epg-container">
        <p style="color: #666;">Загрузка ТВ-программы...</p>
      </div>
    </div>

    <div id="tab-account" class="tab-content">
      <div class="account-card" id="accountBox"></div>
    </div>
  </div>

  <nav class="bottom-nav">
    <div class="nav-item active" onclick="switchTab('home', this)">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>Главная</span>
    </div>
    <div class="nav-item" onclick="switchTab('epg', this)">
      <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14zM5 15h14v2H5zm0-4h14v2H5zm0-4h14v2H5z"/></svg>
      <span>ТВ-программа</span>
    </div>
    <div class="nav-item" onclick="switchTab('account', this)">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <span>Аккаунт</span>
    </div>
  </nav>

  <script>
    const YANDEX_CLIENT_ID = 'b065196734cb494e8965207de203df4f';

    let allChannels = [];
    let categoriesSet = new Set();
    let epgScheduleMap = {};
    let hls = null;
    let savedVolume = 0.8;

    function toggleMute() {
      const video = document.getElementById('videoPlayer');
      const muteBtn = document.getElementById('muteBtn');
      const slider = document.getElementById('volumeSlider');

      video.muted = !video.muted;

      if (video.muted) {
        muteBtn.innerText = '🔇';
      } else {
        video.volume = savedVolume > 0 ? savedVolume : 0.8;
        slider.value = video.volume;
        muteBtn.innerText = video.volume > 0.5 ? '🔊' : '🔉';
      }
    }

    function changeVolume(val) {
      const video = document.getElementById('videoPlayer');
      const muteBtn = document.getElementById('muteBtn');
      
      savedVolume = parseFloat(val);
      video.volume = savedVolume;

      if (savedVolume === 0) {
        video.muted = true;
        muteBtn.innerText = '🔇';
      } else {
        video.muted = false;
        muteBtn.innerText = savedVolume > 0.5 ? '🔊' : '🔉';
      }
    }

    function playStream(url, name) {
      const video = document.getElementById('videoPlayer');
      document.getElementById('playerChannelName').innerText = name;

      if (Hls.isSupported()) {
        if (hls) hls.destroy();
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play();
          video.volume = savedVolume;
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.addEventListener('loadedmetadata', () => {
          video.play();
          video.volume = savedVolume;
        });
      }
    }

    async function loadPlaylist() {
      try {
        const res = await fetch('./playlist.m3u?v=' + Date.now());
        if (!res.ok) throw new Error("Файл не найден");
        const text = await res.text();
        parseM3U(text);
      } catch (e) {
        console.warn("Локальный плейлист не найден.");
      }
    }

    function parseM3U(text) {
      allChannels = [];
      categoriesSet.clear();
      const lines = text.split('\n');
      let current = null;

      lines.forEach(line => {
        line = line.trim();
        if (line.startsWith('#EXTINF:')) {
          const logoMatch = line.match(/tvg-logo="([^"]+)"/);
          const groupMatch = line.match(/group-title="([^"]+)"/);
          const tvgNameMatch = line.match(/tvg-name="([^"]+)"/);
          const nameParts = line.split(',');
          const displayName = nameParts[nameParts.length - 1].trim();

          const group = groupMatch ? groupMatch[1] : 'Развлекательные';
          categoriesSet.add(group);

          current = {
            logo: logoMatch ? logoMatch[1] : '',
            group: group,
            name: displayName,
            tvgName: tvgNameMatch ? tvgNameMatch[1] : displayName,
            url: ''
          };
        } else if (line && !line.startsWith('#') && current) {
          current.url = line;
          allChannels.push(current);
          current = null;
        }
      });

      renderCategories();
      renderChannels(allChannels);
      loadEpgJson();

      if (allChannels.length > 0) {
        playStream(allChannels[0].url, allChannels[0].name);
      }
    }

    function renderCategories() {
      const container = document.getElementById('categoryContainer');
      container.innerHTML = '<div class="cat-chip active" onclick="filterCategory(\'all\', this)">Все каналы</div>';

      categoriesSet.forEach(cat => {
        const chip = document.createElement('div');
        chip.className = 'cat-chip';
        chip.innerText = cat;
        chip.onclick = () => filterCategory(cat, chip);
        container.appendChild(chip);
      });
    }

    function renderChannels(channels) {
      const container = document.getElementById('channelList');
      container.innerHTML = '';

      channels.forEach((ch, idx) => {
        const card = document.createElement('div');
        card.className = `channel-card ${idx === 0 ? 'active' : ''}`;
        card.onclick = () => {
          document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active'));
          card.classList.add('active');
          playStream(ch.url, ch.name);
        };

        const cleanKey = cleanChannelName(ch.tvgName || ch.name);
        const epgCurrent = epgScheduleMap[cleanKey] || 'Прямой эфир';

        card.innerHTML = `
          <img class="channel-logo" src="${ch.logo}" onerror="this.src='https://via.placeholder.com/50/181820/ffffff?text=TV'">
          <div class="channel-info">
            <div class="channel-title">${ch.name}</div>
            <div class="channel-epg">${epgCurrent}</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function cleanChannelName(name) {
      if (!name) return '';
      return name.toLowerCase()
        .replace(/[\!\?\"\'\«\»\(\)\-]/g, ' ')
        .replace(/\b(hd|sd|fhd|4k|50fps|720p|1080p|канал|tv|тв)\b/g, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function timeToMinutes(timeStr) {
      if (!timeStr || !timeStr.includes(':')) return -1;
      const parts = timeStr.split(':');
      return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
    }

    async function loadEpgJson() {
      const epgContainer = document.getElementById('epgList');
      epgContainer.innerHTML = '<p style="color: #ff6600;">Синхронизация телепрограммы...</p>';

      try {
        const res = await fetch('./epg.json?v=' + Date.now());
        if (!res.ok) throw new Error("Файл epg.json не найден");

        const data = await res.json();
        epgContainer.innerHTML = '';

        const epgChannels = data.channels || [];
        const now = new Date();
        const currentMinutes = now.getHours() * 60 + now.getMinutes();

        allChannels.forEach(plChannel => {
          const plTvgClean = cleanChannelName(plChannel.tvgName);
          const plNameClean = cleanChannelName(plChannel.name);

          const matchedEpg = epgChannels.find(epg => {
            const epgClean = cleanChannelName(epg.name);
            return epgClean === plTvgClean || epgClean === plNameClean || 
                   epgClean.includes(plTvgClean) || plTvgClean.includes(epgClean);
          });

          const epgCard = document.createElement('div');
          epgCard.className = 'epg-card';

          let programsHtml = '';

          if (matchedEpg && matchedEpg.programs && matchedEpg.programs.length > 0) {
            const progs = matchedEpg.programs;

            const processedProgs = progs.map((p, i) => {
              const startMin = timeToMinutes(p.time);
              let endMin = 1440;

              if (i < progs.length - 1) {
                const nextStart = timeToMinutes(progs[i + 1].time);
                if (nextStart > startMin) endMin = nextStart;
              }
              return { ...p, startMin, endMin };
            });

            let nowProg = processedProgs.find(p => currentMinutes >= p.startMin && currentMinutes < p.endMin);
            const upcomingProgs = processedProgs.filter(p => p.startMin > currentMinutes);

            if (!nowProg && upcomingProgs.length > 0) {
              nowProg = upcomingProgs.shift();
            }

            if (nowProg) {
              const duration = Math.max(1, nowProg.endMin - nowProg.startMin);
              const elapsed = Math.max(0, currentMinutes - nowProg.startMin);
              const progressPct = Math.min(100, Math.round((elapsed / duration) * 100));

              programsHtml += `
                <div class="epg-item is-now">
                  <div class="epg-row">
                    <span class="epg-time">${nowProg.time}</span>
                    <span class="epg-title">${nowProg.title} <span class="now-badge">В ЭФИРЕ</span></span>
                  </div>
                  <div class="epg-progress-bar">
                    <div class="epg-progress-fill" style="width: ${progressPct}%;"></div>
                  </div>
                </div>
              `;

              epgScheduleMap[plTvgClean] = `${nowProg.time} — ${nowProg.title}`;
              epgScheduleMap[plNameClean] = `${nowProg.time} — ${nowProg.title}`;
            }

            upcomingProgs.slice(0, 5).forEach(p => {
              programsHtml += `
                <div class="epg-item">
                  <div class="epg-row">
                    <span class="epg-time">${p.time}</span>
                    <span class="epg-title">${p.title}</span>
                  </div>
                </div>
              `;
            });

          } else {
            programsHtml = '<div style="color:#666; font-size: 13px;">Телепрограмма временно недоступна</div>';
            epgScheduleMap[plTvgClean] = 'Прямой эфир';
            epgScheduleMap[plNameClean] = 'Прямой эфир';
          }

          epgCard.innerHTML = `
            <div class="epg-header">
              ${plChannel.logo ? `<img class="epg-logo" src="${plChannel.logo}" onerror="this.style.display='none'">` : ''}
              <h3 style="font-size: 16px;">${plChannel.name}</h3>
            </div>
            <div>${programsHtml}</div>
          `;

          epgContainer.appendChild(epgCard);
        });

        renderChannels(allChannels);

      } catch (e) {
        console.warn("Ошибка подгрузки EPG:", e);
      }
    }

    function filterCategory(cat, element) {
      document.querySelectorAll('.cat-chip').forEach(el => el.classList.remove('active'));
      element.classList.add('active');

      if (cat === 'all') {
        renderChannels(allChannels);
      } else {
        const filtered = allChannels.filter(c => c.group === cat);
        renderChannels(filtered);
      }
    }

    function switchTab(tabId, el) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

      document.getElementById(`tab-${tabId}`).classList.add('active');
      el.classList.add('active');
    }

    function toggleFullscreen() {
      const video = document.getElementById('videoPlayer');
      if (video.requestFullscreen) video.requestFullscreen();
    }

    function loginWithYandex() {
      const redirectUri = window.location.origin + window.location.pathname;
      window.location.href = `https://oauth.yandex.ru/authorize?response_type=token&client_id=${YANDEX_CLIENT_ID}&redirect_uri=${encodeURIComponent(redirectUri)}`;
    }

    function checkYandexAuth() {
      const hash = window.location.hash;
      if (hash.includes('access_token')) {
        const params = new URLSearchParams(hash.replace('#', '?'));
        const token = params.get('access_token');
        
        fetch('https://login.yandex.ru/info?format=json', {
          headers: { 'Authorization': `OAuth ${token}` }
        })
        .then(res => res.json())
        .then(user => {
          localStorage.setItem('yandex_user', JSON.stringify(user));
          window.history.replaceState({}, document.title, window.location.pathname);
          renderAccount();
        });
      } else {
        renderAccount();
      }
    }

    function renderAccount() {
      const accountBox = document.getElementById('accountBox');
      const savedUser = localStorage.getItem('yandex_user');

      if (savedUser) {
        const user = JSON.parse(savedUser);
        const avatarUrl = user.default_avatar_id ? `https://avatars.yandex.net/get-yapic/${user.default_avatar_id}/islands-200` : 'https://via.placeholder.com/80';
        
        accountBox.innerHTML = `
          <img class="avatar" src="${avatarUrl}">
          <h2 style="font-size: 20px; margin-bottom: 4px;">${user.real_name || user.login}</h2>
          <p style="color: #888; font-size: 14px; margin-bottom: 20px;">@${user.login}</p>
          <button class="btn-yandex btn-logout" onclick="logout()">Выйти из профиля</button>
        `;
      } else {
        accountBox.innerHTML = `
          <h2 style="font-size: 20px; margin-bottom: 12px;">Вход в Телевизор 34</h2>
          <p style="color: #888; font-size: 14px; margin-bottom: 24px;">Войдите через Яндекс ID</p>
          <button class="btn-yandex" onclick="loginWithYandex()">
            Войти через Яндекс
          </button>
        `;
      }
    }

    function logout() {
      localStorage.removeItem('yandex_user');
      renderAccount();
    }

    loadPlaylist();
    checkYandexAuth();
  </script>
</body>
</html>
