<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Бесплатная Телепрограмма (EPG)</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --text: #c9d1d9;
      --accent: #58a6ff;
      --border: #30363d;
      --live: #f85149;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }

    header {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border);
    }

    h1 { font-size: 1.5rem; color: var(--accent); }

    .controls { display: flex; gap: 10px; flex-wrap: wrap; flex-grow: 1; justify-content: flex-end; }
    input, select {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      outline: none;
    }

    .status { text-align: center; padding: 40px; color: #8b949e; }
    
    .list { display: flex; flex-direction: column; gap: 10px; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 14px;
      border-radius: 8px;
      display: flex;
      gap: 15px;
      align-items: flex-start;
    }

    .card.active { border-left: 4px solid var(--live); }

    .time {
      background: rgba(88, 166, 255, 0.1);
      color: var(--accent);
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.95rem;
      white-space: nowrap;
    }

    .title { font-size: 1.05rem; font-weight: 600; color: #fff; margin-bottom: 4px; }
    .desc { font-size: 0.85rem; color: #8b949e; line-height: 1.3; }
    .badge { background: var(--live); color: #fff; font-size: 0.7rem; padding: 2px 6px; border-radius: 3px; margin-left: 8px; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>📺 Телепрограмма (Free EPG)</h1>
      <div class="controls">
        <select id="channelSelect">
          <option value="">Загрузка списка каналов...</option>
        </select>
        <input type="text" id="searchInput" placeholder="Поиск по передачам...">
      </div>
    </header>

    <main id="content">
      <div class="status" id="statusMsg">Загрузка актуального файла телепрограммы (XMLTV)...</div>
    </main>
  </div>

  <script>
    // Бесплатный источник XMLTV через CORS-прокси
    const EPG_URL = 'https://api.allorigins.win/raw?url=' + encodeURIComponent('http://epg.it999.ru/epg.xml');

    let xmlDoc = null;
    let channelsMap = {};
    let currentPrograms = [];

    const channelSelect = document.getElementById('channelSelect');
    const searchInput = document.getElementById('searchInput');
    const statusMsg = document.getElementById('statusMsg');
    const content = document.getElementById('content');

    async function loadEPG() {
      try {
        const response = await fetch(EPG_URL);
        if (!response.ok) throw new Error('Не удалось загрузить EPG');
        
        const xmlText = await response.text();
        const parser = new DOMParser();
        xmlDoc = parser.parseFromString(xmlText, "text/xml");

        // Парсим каналы
        const channelNodes = xmlDoc.querySelectorAll('channel');
        channelSelect.innerHTML = '<option value="">-- Выберите канал --</option>';

        channelNodes.forEach(ch => {
          const id = ch.getAttribute('id');
          const name = ch.querySelector('display-name')?.textContent || id;
          channelsMap[id] = name;

          const opt = document.createElement('option');
          opt.value = id;
          opt.textContent = name;
          channelSelect.appendChild(opt);
        });

        statusMsg.textContent = 'Каналы загружены! Выберите канал из списка.';

      } catch (err) {
        console.error(err);
        statusMsg.textContent = 'Ошибка загрузки телепрограммы. Попробуйте обновить страницу.';
      }
    }

    // Парсим дату XMLTV формата: YYYYMMDDHHMMSS +0300
    function parseXmlDate(str) {
      if (!str) return null;
      const y = str.substring(0, 4);
      const m = str.substring(4, 6) - 1;
      const d = str.substring(6, 8);
      const h = str.substring(8, 10);
      const min = str.substring(10, 12);
      return new Date(Date.UTC(y, m, d, h - 3, min)); // Смещение MSK
    }

    function loadChannelSchedule() {
      const channelId = channelSelect.value;
      if (!channelId) {
        content.innerHTML = '<div class="status">Выберите канал из списка выше</div>';
        return;
      }

      const programmeNodes = xmlDoc.querySelectorAll(`programme[channel="${channelId}"]`);
      currentPrograms = [];

      programmeNodes.forEach(p => {
        const start = parseXmlDate(p.getAttribute('start'));
        const stop = parseXmlDate(p.getAttribute('stop'));
        const title = p.querySelector('title')?.textContent || 'Без названия';
        const desc = p.querySelector('desc')?.textContent || '';

        currentPrograms.push({ start, stop, title, desc });
      });

      renderSchedule(currentPrograms);
    }

    function renderSchedule(programs) {
      if (!programs || programs.length === 0) {
        content.innerHTML = '<div class="status">На этот канал нет программы передач</div>';
        return;
      }

      const now = new Date();
      let html = '<div class="list">';

      programs.forEach(prog => {
        const timeStr = prog.start ? prog.start.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '--:--';
        const isNow = prog.start && prog.stop ? (now >= prog.start && now <= prog.stop) : false;

        html += `
          <div class="card ${isNow ? 'active' : ''}">
            <div class="time">${timeStr}</div>
            <div>
              <div class="title">
                ${escapeHtml(prog.title)}
                ${isNow ? '<span class="badge">В ЭФИРЕ</span>' : ''}
              </div>
              ${prog.desc ? `<div class="desc">${escapeHtml(prog.desc)}</div>` : ''}
            </div>
          </div>
        `;
      });

      html += '</div>';
      content.innerHTML = html;
    }

    function filterPrograms() {
      const q = searchInput.value.toLowerCase().trim();
      if (!q) {
        renderSchedule(currentPrograms);
        return;
      }
      const filtered = currentPrograms.filter(p => 
        p.title.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q)
      );
      renderSchedule(filtered);
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[m]);
    }

    channelSelect.addEventListener('change', loadChannelSchedule);
    searchInput.addEventListener('input', filterPrograms);

    loadEPG();
  </script>
</body>
</html>
