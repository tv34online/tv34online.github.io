<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Телевизор 34 — Android TV</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://yastatic.net/s3/pasport/auth-sdk/v1/auth-sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; outline: none; }
    
    body {
      background-color: #0b0c10;
      color: #ffffff;
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    /* Фокус для пульта */
    button:focus, .channel-item:focus, .category-item:focus, .top-btn:focus {
      border-color: #ff6600 !important;
      background-color: rgba(255, 102, 0, 0.15) !important;
      transform: scale(1.02);
      z-index: 10;
    }

    /* Левая боковая панель категорий */
    .sidebar {
      width: 280px;
      background: #0d0f14;
      border-right: 1px solid rgba(255,255,255,0.06);
      display: flex;
      flex-direction: column;
      padding: 30px 20px;
      flex-shrink: 0;
      overflow-y: auto;
      scrollbar-width: none;
    }
    .sidebar::-webkit-scrollbar { display: none; }

    /* Логотип вместо выбора региона */
    .logo { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 20px; color: #fff; text-decoration: none; margin-bottom: 24px; padding-left: 8px; }
    .logo-badge { background: linear-gradient(135deg, #ff8800, #ff4500); color: #fff; padding: 2px 8px; border-radius: 8px; font-size: 16px; box-shadow: 0 4px 12px rgba(255, 69, 0, 0.3); }

    .menu-section-title { font-size: 11px; font-weight: 700; color: #666; text-transform: uppercase; margin-bottom: 10px; padding-left: 12px; letter-spacing: 0.5px; }
    
    .category-list { display: flex; flex-direction: column; gap: 4px; }
    .category-item {
      background: none; border: 2px solid transparent; color: #aaa; text-align: left;
      padding: 10px 12px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer;
      transition: 0.15s;
    }
    .category-item:hover { color: #fff; background: rgba(255,255,255,0.04); }
    .category-item.active { color: #ff6600; font-weight: 700; background: rgba(255,102,0,0.1); }

    /* Центральная часть: Список каналов */
    .channels-column {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 30px 40px;
      overflow-y: auto;
      scrollbar-width: none;
    }
    .channels-column::-webkit-scrollbar { display: none; }

    .channels-title-header { font-size: 22px; font-weight: 800; }

    .channel-item {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 14px 16px;
      border-radius: 16px;
      border: 2px solid transparent;
      cursor: pointer;
      background: transparent;
      transition: background 0.15s;
      width: 100%;
      text-align: left;
      color: #fff;
    }
    .channel-item:hover { background: rgba(255,255,255,0.03); }

    .channel-badge-box {
      width: 90px; height: 55px; border-radius: 10px; background: #181a24;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      position: relative; border: 1px solid rgba(255,255,255,0.08); flex-shrink: 0;
      overflow: hidden;
    }
    .channel-num-tag {
      position: absolute; top: 4px; left: 6px; font-size: 10px; font-weight: 800; color: #888; font-family: monospace;
    }
    .channel-logo-img { width: 45px; height: 30px; object-fit: contain; }

    .channel-details { flex: 1; overflow: hidden; }
    .channel-subinfo { font-size: 12px; color: #777; font-weight: 600; margin-bottom: 3px; display: flex; gap: 6px; }
    .channel-current-show { font-size: 15px; font-weight: 700; color: #ddd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 8px; }
    
    .channel-progress-bg { width: 100%; height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }
    .channel-progress-fill { height: 100%; background: #ff6600; }

    /* Правая колонка: Информация о программе и Превью */
    .info-column {
      width: 380px;
      background: #0d0f14;
      border-left: 1px solid rgba(255,255,255,0.06);
      padding: 30px 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      flex-shrink: 0;
    }

    .preview-card {
      width: 100%; aspect-ratio: 16/9; background: #161822; border-radius: 14px;
      overflow: hidden; position: relative; border: 1px solid rgba(255,255,255,0.1);
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .preview-card video { width: 100%; height: 100%; object-fit: cover; }
    .play-overlay-btn {
      position: absolute; width: 50px; height: 50px; background: rgba(255,102,0,0.9);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 20px rgba(255,102,0,0.5); cursor: pointer;
    }
    .play-triangle { width: 0; height: 0; border-top: 10px solid transparent; border-bottom: 10px solid transparent; border-left: 16px solid #fff; margin-left: 3px; }

    .show-description-title { font-size: 18px; font-weight: 800; line-height: 1.3; color: #fff; }
    .show-description-text { font-size: 13px; color: #888; line-height: 1.4; }

    .region-btn {
      background: rgba(25, 28, 36, 0.8); border: 2px solid rgba(255, 255, 255, 0.1); color: #fff;
      padding: 8px 16px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer;
    }

    /* Кастомный плеер на весь экран */
    .fullscreen-player-overlay {
      position: fixed; inset: 0; background: #000; z-index: 9999; display: none;
      flex-direction: column; justify-content: space-between; padding: 40px;
    }
    .fullscreen-player-overlay.active { display: flex; }
    .fs-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
    
    .fs-ui {
      position: relative; z-index: 2; pointer-events: none;
      display: flex; flex-direction: column; justify-content: space-between; height: 100%;
      background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, transparent 30%, transparent 70%, rgba(0,0,0,0.9) 100%);
      padding: 10px; opacity: 0; transition: opacity 0.3s;
    }
    .fs-ui.visible { opacity: 1; }

    /* Модальное окно Яндекс */
    .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
      display: flex; align-items: center; justify-content: center; z-index: 10000; display: none;
    }
    .modal-card {
      background: #141620; border: 2px solid rgba(255,255,255,0.1); padding: 30px; border-radius: 20px;
      text-align: center; max-width: 380px; width: 100%; box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }
    .avatar { width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 16px; border: 3px solid #ff6600; object-fit: cover; }
    .btn-yandex {
      background: #fc3f1d; color: white; border: none; padding: 12px 24px;
      border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; width: 100%; margin-top: 15px;
    }
  </style>
</head>
<body>

  <!-- Левая панель: Логотип и Категории -->
  <aside class="sidebar">
    <a href="#" class="logo">
      <span>ТЕЛЕВИЗОР</span>
      <span class="logo-badge">34</span>
    </a>

    <div class="menu-section-title">Каналы</div>
    <div class="category-list" id="categoryList">
      <button class="category-item active" tabIndex="0" onclick="filterCategory('all', this)">Все каналы</button>
      <button class="category-item" tabIndex="0" onclick="filterCategory('fav', this)">Избранные</button>
      <button class="category-item" tabIndex="0" onclick="filterCategory('Эфирные', this)">Эфирные</button>
      <button class="category-item" tabIndex="0" onclick="filterCategory('Спортивные', this)">Спортивные</button>
      <button class="category-item" tabIndex="0" onclick="filterCategory('Кино и сериалы', this)">Кино и сериалы</button>
      <button class="category-item" tabIndex="0" onclick="filterCategory('Развлекательные', this)">Развлекательные</button>
      <button class="category-item" tabIndex="0" onclick="filterCategory('Информационные', this)">Информационные</button>
      <button class="category-item" tabIndex="0" onclick="filterCategory('Детские', this)">Детские</button>
      <button class="category-item" tabIndex="0" onclick="filterCategory('Познавательные', this)">Познавательные</button>
      <button class="category-item" tabIndex="0" onclick="filterCategory('Музыкальные', this)">Музыкальные</button>
      <button class="category-item" tabIndex="0" onclick="filterCategory('Взрослые', this)">Взрослые</button>
    </div>
  </aside>

  <!-- Центральная колонка: Список каналов -->
  <main class="channels-column">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h1 class="channels-title-header" id="categoryTitle">Все каналы</h1>
      <button class="region-btn" id="authHeaderBtn" tabIndex="0" onclick="openAuthModal()">👤 Войти в Яндекс</button>
    </div>

    <div id="channelList" style="display: flex; flex-direction: column; gap: 8px;">
      <p style="color: #888;">Загрузка каналов...</p>
    </div>
  </main>

  <!-- Правая колонка: Детали передачи и Превью плеера -->
  <div class="info-column">
    <div class="preview-card" onclick="openFullscreen()">
      <video id="previewVideo" autoplay muted playsinline></video>
      <div class="play-overlay-btn">
        <div class="play-triangle"></div>
      </div>
    </div>
    
    <div>
      <div id="infoTime" style="font-size: 13px; font-weight: 700; color: #ff6600; margin-bottom: 6px;">--:-- - --:--</div>
      <h3 class="show-description-title" id="infoTitle">Выберите канал</h3>
      <p class="show-description-text" id="infoCategory" style="margin-top: 6px;">Познавательные передачи, 0+</p>
    </div>
  </div>

  <!-- Кастомный полноэкранный плеер -->
  <div class="fullscreen-player-overlay" id="fsOverlay" onclick="showFsUi()">
    <video class="fs-video" id="fsVideo" autoplay playsinline></video>
    <div class="fs-ui" id="fsUi">
      <div style="text-align: center;">
        <h2 id="fsShowTitle" style="font-size: 26px; font-weight: 800; color: #fff;">Название</h2>
        <p id="fsChannelName" style="color: #aaa; font-size: 15px; margin-top: 4px;">Канал</p>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div style="background: rgba(255,255,255,0.1); padding: 8px 16px; border-radius: 10px; font-size: 13px; font-weight: 700;">📺 ТВ-передачи</div>
        <div style="background: #ff6600; color: #fff; padding: 6px 14px; border-radius: 99px; font-size: 12px; font-weight: 800;">Сейчас в эфире</div>
      </div>
    </div>
  </div>

  <!-- Модальное окно Яндекс -->
  <div class="modal" id="authModal" onclick="if(event.target === this) closeAuthModal()">
    <div class="modal-card">
      <div id="modalBody"></div>
      <button class="region-btn" style="width:100%; justify-content:center; margin-top:15px; background:rgba(255,255,255,0.08);" tabIndex="0" onclick="closeAuthModal()">Закрыть</button>
    </div>
  </div>

  <script>
    const YANDEX_CLIENT_ID = '0fc0a6b7929b4efdb1822f75b1c078b8';
    const EPG_URL = 'https://raw.githubusercontent.com/iboxestvoff/televizor34_serverfiles/epg-data/epg.xml';
    
    const EPG_DB_NAME = 'televizor34-epg';
    const EPG_STORE = 'cache';
    const EPG_CACHE_KEY = 'epg-v1';
    const EPG_MAX_AGE_MS = 12 * 60 * 60 * 1000;

    let allChannels = [];
    let currentFilteredChannels = [];
    let currentSelectedChannelIndex = 0;
    let currentFilterMode = 'all';
    let favorites = JSON.parse(localStorage.getItem('tv34_favorites') || '[]');

    let hlsPreview = null;
    let hlsFs = null;
    let epgData = null;
    let epgChannelIdForIndex = new Map();
    let fsTimer = null;

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function normalizeName(s) {
      return (s || '').toLowerCase().replace(/[^a-zа-яё0-9]/gi, '');
    }

    function fmtTime(d) {
      const date = new Date(d);
      return String(date.getHours()).padStart(2, '0') + ':' + String(date.getMinutes()).padStart(2, '0');
    }

    // Навигация с пульта
    window.addEventListener('keydown', (e) => {
      const isFsActive = document.getElementById('fsOverlay').classList.contains('active');

      if (isFsActive) {
        if (e.key === 'Escape' || e.key === 'Backspace') {
          closeFullscreen();
          e.preventDefault();
        } else {
          showFsUi();
        }
        return;
      }

      if (currentFilteredChannels.length === 0) return;

      if (e.key === 'ArrowUp') {
        currentSelectedChannelIndex = (currentSelectedChannelIndex - 1 + currentFilteredChannels.length) % currentFilteredChannels.length;
        focusChannelCard(currentSelectedChannelIndex);
        updatePreviewAndInfo();
        e.preventDefault();
      } else if (e.key === 'ArrowDown') {
        currentSelectedChannelIndex = (currentSelectedChannelIndex + 1) % currentFilteredChannels.length;
        focusChannelCard(currentSelectedChannelIndex);
        updatePreviewAndInfo();
        e.preventDefault();
      } else if (e.key === 'ArrowLeft') {
        document.querySelector('.category-item').focus();
        e.preventDefault();
      }
    });

    function focusChannelCard(index) {
      const cards = document.querySelectorAll('.channel-item');
      if (cards[index]) {
        cards[index].focus();
        cards[index].scrollIntoView({ block: 'nearest' });
      }
    }

    function filterCategory(mode, el) {
      currentFilterMode = mode;
      document.querySelectorAll('.category-item').forEach(i => i.classList.remove('active'));
      el.classList.add('active');
      document.getElementById('categoryTitle').innerText = mode === 'fav' ? 'Избранные каналы' : (mode === 'all' ? 'Все каналы' : mode);
      currentSelectedChannelIndex = 0;
      renderChannels();
    }

    function updatePreviewAndInfo() {
      const ch = currentFilteredChannels[currentSelectedChannelIndex];
      if (!ch) return;
      const globalIndex = allChannels.findIndex(c => c.url === ch.url);

      const chId = epgChannelIdForIndex.get(globalIndex);
      const programs = chId && epgData ? (epgData.programsByChannelId.get(chId) || []) : [];
      const now = new Date();
      const currentProg = programs.find(p => new Date(p.start) <= now && now < new Date(p.stop));

      if (currentProg) {
        document.getElementById('infoTime').innerText = `${fmtTime(currentProg.start)} - ${fmtTime(currentProg.stop)}`;
        document.getElementById('infoTitle').innerText = currentProg.title;
      } else {
        document.getElementById('infoTime').innerText = 'Прямой эфир';
        document.getElementById('infoTitle').innerText = ch.name;
      }
      document.getElementById('infoCategory').innerText = `${ch.group || 'ТВ'} • 0+`;

      playPreviewStream(ch.url);
    }

    function playPreviewStream(url) {
      const video = document.getElementById('previewVideo');
      if (Hls.isSupported()) {
        if (hlsPreview) hlsPreview.destroy();
        hlsPreview = new Hls();
        hlsPreview.loadSource(url);
        hlsPreview.attachMedia(video);
        hlsPreview.on(Hls.Events.MANIFEST_PARSED, () => { video.play().catch(()=>{}); });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.addEventListener('loadedmetadata', () => { video.play().catch(()=>{}); });
      }
    }

    function openFullscreen() {
      const ch = currentFilteredChannels[currentSelectedChannelIndex];
      if (!ch) return;
      const globalIndex = allChannels.findIndex(c => c.url === ch.url);

      const chId = epgChannelIdForIndex.get(globalIndex);
      const programs = chId && epgData ? (epgData.programsByChannelId.get(chId) || []) : [];
      const now = new Date();
      const currentProg = programs.find(p => new Date(p.start) <= now && now < new Date(p.stop));

      document.getElementById('fsShowTitle').innerText = currentProg ? currentProg.title : ch.name;
      document.getElementById('fsChannelName').innerText = `${globalIndex + 1}. ${ch.name}`;

      const video = document.getElementById('fsVideo');
      if (Hls.isSupported()) {
        if (hlsFs) hlsFs.destroy();
        hlsFs = new Hls();
        hlsFs.loadSource(ch.url);
        hlsFs.attachMedia(video);
        hlsFs.on(Hls.Events.MANIFEST_PARSED, () => { video.play().catch(()=>{}); });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = ch.url;
        video.addEventListener('loadedmetadata', () => { video.play().catch(()=>{}); });
      }

      document.getElementById('fsOverlay').classList.add('active');
      showFsUi();
    }

    function closeFullscreen() {
      document.getElementById('fsOverlay').classList.remove('active');
      const video = document.getElementById('fsVideo');
      video.pause();
      video.src = '';
    }

    function showFsUi() {
      const ui = document.getElementById('fsUi');
      ui.classList.add('visible');
      clearTimeout(fsTimer);
      fsTimer = setTimeout(() => { ui.classList.remove('visible'); }, 4000);
    }

    function renderChannels() {
      const container = document.getElementById('channelList');
      container.innerHTML = '';
      const now = new Date();

      if (currentFilterMode === 'all') {
        currentFilteredChannels = allChannels;
      } else if (currentFilterMode === 'fav') {
        currentFilteredChannels = allChannels.filter(ch => favorites.includes(ch.name));
      } else {
        currentFilteredChannels = allChannels.filter(ch => (ch.group || '').toLowerCase() === currentFilterMode.toLowerCase());
      }

      if (currentFilteredChannels.length === 0) {
        container.innerHTML = '<p style="color: #888; padding: 20px;">В этой категории нет каналов</p>';
        return;
      }

      currentFilteredChannels.forEach((ch, filteredIdx) => {
        const globalIndex = allChannels.findIndex(c => c.url === ch.url);
        const chId = epgChannelIdForIndex.get(globalIndex);
        const programs = chId && epgData ? (epgData.programsByChannelId.get(chId) || []) : [];
        
        const currentProg = programs.find(p => new Date(p.start) <= now && now < new Date(p.stop));
        const showTitle = currentProg ? currentProg.title : 'Прямой эфир';
        
        let pct = 100;
        if (currentProg) {
          const total = currentProg.stop - currentProg.start;
          const elapsed = now - currentProg.start;
          pct = total > 0 ? Math.min(100, Math.max(0, (elapsed / total) * 100)) : 0;
        }

        const card = document.createElement('button');
        card.className = 'channel-item';
        card.tabIndex = 0;
        card.onclick = () => {
          currentSelectedChannelIndex = filteredIdx;
          updatePreviewAndInfo();
          openFullscreen();
        };

        card.onfocus = () => {
          currentSelectedChannelIndex = filteredIdx;
          updatePreviewAndInfo();
        };

        card.innerHTML = `
          <div class="channel-badge-box">
            <span class="channel-num-tag">${String(globalIndex + 1).padStart(3, '0')}</span>
            <img class="channel-logo-img" src="${ch.logo || ''}" onerror="this.style.display='none'">
          </div>
          <div class="channel-details">
            <div class="channel-subinfo">
              <span>SD</span>
              <span>•</span>
              <span>${escapeHtml(ch.name)}</span>
            </div>
            <div class="channel-current-show">${escapeHtml(showTitle)}</div>
            <div class="channel-progress-bg">
              <div class="channel-progress-fill" style="width: ${pct}%"></div>
            </div>
          </div>
        `;
        container.appendChild(card);
      });

      updatePreviewAndInfo();
    }

    function openEpgDb() {
      return new Promise((resolve, reject) => {
        if (typeof indexedDB === 'undefined') return reject(new Error('IndexedDB недоступен'));
        const req = indexedDB.open(EPG_DB_NAME, 1);
        req.onupgradeneeded = () => { req.result.createObjectStore(EPG_STORE); };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function loadEpgFromCache() {
      try {
        const db = await openEpgDb();
        return await new Promise((resolve) => {
          const tx = db.transaction(EPG_STORE, 'readonly');
          const req = tx.objectStore(EPG_STORE).get(EPG_CACHE_KEY);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        });
      } catch (e) { return null; }
    }

    async function saveEpgToCache(data) {
      try {
        const db = await openEpgDb();
        const tx = db.transaction(EPG_STORE, 'readwrite');
        tx.objectStore(EPG_STORE).put({
          savedAt: Date.now(),
          idByNormalizedName: data.idByNormalizedName,
          programsByChannelId: data.programsByChannelId
        }, EPG_CACHE_KEY);
      } catch (e) {}
    }

    const EPG_WORKER_SRC = [
      'function decodeXmlEntities(s){',
      '  return s.replace(/&(amp|lt|gt|quot|apos|#x[0-9a-fA-F]+|#\\d+);/g, function(m, g){',
      '    if(g === "amp") return "&";',
      '    if(g === "lt") return "<";',
      '    if(g === "gt") return ">";',
      '    if(g === "quot") return \'"\';',
      "    if(g === 'apos') return \"'\";",
      '    if(g[0] === "#"){',
      '      var code = g[1] === "x" ? parseInt(g.slice(2), 16) : parseInt(g.slice(1), 10);',
      '      return isNaN(code) ? m : String.fromCodePoint(code);',
      '    }',
      '    return m;',
      '  });',
      '}',
      'function getAttr(str, name){',
      '  var m = str.match(new RegExp(name + "=\\"([^\\"]*)\\""));',
      '  return m ? m[1] : null;',
      '}',
      'function parseXmltvTime(s){',
      '  if(!s) return null;',
      '  var m = s.match(/^(\\d{4})(\\d{2})(\\d{2})(\\d{2})(\\d{2})(\\d{2})\\s*([+-]\\d{2})?(\\d{2})?/);',
      '  if(!m) return null;',
      '  var Y=+m[1],Mo=+m[2],D=+m[3],H=+m[4],Mi=+m[5],S=+m[6],offH=m[7],offM=m[8];',
      '  var ms = Date.UTC(Y, Mo-1, D, H, Mi, S);',
      '  if(offH){',
      '    var sign = offH[0] === "-" ? -1 : 1;',
      '    var offsetMinutes = sign * (parseInt(offH.slice(1),10)*60 + (offM?parseInt(offM,10):0));',
      '    ms -= offsetMinutes*60000;',
      '  }',
      '  return new Date(ms);',
      '}',
      'function normalizeName(s){',
      '  return (s||"").toLowerCase().replace(/[^a-zа-яё0-9]/gi,"");',
      '}',
      'async function decompressIfGzip(bytes){',
      '  var isGzip = bytes.length > 2 && bytes[0] === 0x1f && bytes[1] === 0x8b;',
      '  if(!isGzip) return new TextDecoder("utf-8").decode(bytes);',
      '  var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));',
      '  var buf = await new Response(stream).arrayBuffer();',
      '  return new TextDecoder("utf-8").decode(buf);',
      '}',
      'self.onmessage = async function(e){',
      '  try{',
      '    var bytes = e.data.bytes;',
      '    var text = await decompressIfGzip(bytes);',
      '    var idByNormalizedName = new Map();',
      '    var channelRe = /<channel\\s+id="([^"]*)"[^>]*>([\\s\\S]*?)<\\/channel>/g;',
      '    var dnRe = /<display-name[^>]*>([\\s\\S]*?)<\\/display-name>/g;',
      '    var cm;',
      '    while((cm = channelRe.exec(text))){',
      '      var id = cm[1];',
      '      var inner = cm[2];',
      '      var dm;',
      '      dnRe.lastIndex = 0;',
      '      while((dm = dnRe.exec(inner))){',
      '        var norm = normalizeName(decodeXmlEntities(dm[1]));',
      '        if(norm && !idByNormalizedName.has(norm)) idByNormalizedName.set(norm, id);',
      '      }',
      '    }',
      '    var programsByChannelId = new Map();',
      '    var progRe = /<programme\\s+([^>]*)>([\\s\\S]*?)<\\/programme>/g;',
      '    var titleRe = /<title[^>]*>([\\s\\S]*?)<\\/title>/;',
      '    var pm;',
      '    while((pm = progRe.exec(text))){',
      '      var attrs = pm[1];',
      '      var inner2 = pm[2];',
      '      var chId = getAttr(attrs, "channel");',
      '      var start = parseXmltvTime(getAttr(attrs, "start"));',
      '      var stop = parseXmltvTime(getAttr(attrs, "stop"));',
      '      if(!chId || !start || !stop) continue;',
      '      var tm = titleRe.exec(inner2);',
      '      var title = tm ? decodeXmlEntities(tm[1]).trim() : "Без названия";',
      '      if(!programsByChannelId.has(chId)) programsByChannelId.set(chId, []);',
      '      programsByChannelId.get(chId).push({ start: start, stop: stop, title: title });',
      '    }',
      '    programsByChannelId.forEach(function(list){ list.sort(function(a,b){ return a.start - b.start; }); });',
      '    self.postMessage({ ok: true, idByNormalizedName: idByNormalizedName, programsByChannelId: programsByChannelId });',
      '  }catch(err){',
      '    self.postMessage({ ok: false, error: (err && err.message) || String(err) });',
      '  }',
      '};'
    ].join('\n');

    let epgWorker = null;
    function getEpgWorker(){
      if(!epgWorker){
        const blob = new Blob([EPG_WORKER_SRC], { type: 'application/javascript' });
        epgWorker = new Worker(URL.createObjectURL(blob));
      }
      return epgWorker;
    }

    function parseEpgInWorker(bytes){
      return new Promise((resolve, reject) => {
        const worker = getEpgWorker();
        function onMessage(e){
          worker.removeEventListener('message', onMessage);
          worker.removeEventListener('error', onError);
          if(e.data.ok) resolve({ idByNormalizedName: e.data.idByNormalizedName, programsByChannelId: e.data.programsByChannelId });
          else reject(new Error(e.data.error));
        }
        function onError(err){
          worker.removeEventListener('message', onMessage);
          worker.removeEventListener('error', onError);
          reject(new Error(err.message || 'ошибка воркера'));
        }
        worker.addEventListener('message', onMessage);
        worker.addEventListener('error', onError);
        worker.postMessage({ bytes }, [bytes.buffer]);
      });
    }

    function buildEpgMatches(){
      epgChannelIdForIndex = new Map();
      if(!epgData) return;
      allChannels.forEach((ch, i) => {
        let id = null;
        if(ch.tvgId && epgData.programsByChannelId.has(ch.tvgId)) id = ch.tvgId;
        if(!id){
          const norm = normalizeName(ch.name);
          id = epgData.idByNormalizedName.get(norm) || null;
        }
        epgChannelIdForIndex.set(i, id);
      });
    }

    // Яндекс Авторизация
    function openAuthModal() {
      document.getElementById('authModal').style.display = 'flex';
      renderAuthModalContent();
    }
    function closeAuthModal() {
      document.getElementById('authModal').style.display = 'none';
    }
    function loginWithYandex() {
      const redirectUri = window.location.origin + window.location.pathname;
      window.location.href = `https://oauth.yandex.ru/authorize?response_type=token&client_id=${YANDEX_CLIENT_ID}&redirect_uri=${encodeURIComponent(redirectUri)}`;
    }
    function checkYandexAuth() {
      const hash = window.location.hash;
      if (hash.includes('access_token')) {
        const params = new URLSearchParams(hash.replace('#', '?'));
        const token = params.get('access_token');
        fetch('https://login.yandex.ru/info?format=json', {
          headers: { 'Authorization': 'OAuth ' + token }
        })
        .then(res => res.json())
        .then(user => {
          localStorage.setItem('tv34_yandex_user', JSON.stringify(user));
          window.history.replaceState({}, document.title, window.location.pathname);
          renderAuthHeader();
        });
      } else {
        renderAuthHeader();
      }
    }
    function renderAuthHeader() {
      const userStr = localStorage.getItem('tv34_yandex_user');
      const btn = document.getElementById('authHeaderBtn');
      if (userStr) {
        const user = JSON.parse(userStr);
        btn.innerText = `👤 ${user.real_name || user.login}`;
      } else {
        btn.innerText = `👤 Войти в Яндекс`;
      }
    }
    function renderAuthModalContent() {
      const body = document.getElementById('modalBody');
      const userStr = localStorage.getItem('tv34_yandex_user');
      if (userStr) {
        const user = JSON.parse(userStr);
        const avatarUrl = user.default_avatar_id ? `https://avatars.yandex.net/get-yapic/${user.default_avatar_id}/islands-200` : 'https://via.placeholder.com/80';
        body.innerHTML = `
          <img class="avatar" src="${avatarUrl}">
          <h3 style="font-size: 18px; margin-bottom: 4px;">${escapeHtml(user.real_name || user.login)}</h3>
          <p style="color: #888; font-size: 13px; margin-bottom: 20px;">@${escapeHtml(user.login)}</p>
          <button class="btn-yandex" style="background: rgba(255,255,255,0.1);" tabIndex="0" onclick="logoutYandex()">Выйти из профиля</button>
        `;
      } else {
        body.innerHTML = `
          <h3 style="font-size: 18px; margin-bottom: 8px;">Вход в Телевизор 34</h3>
          <p style="color: #888; font-size: 13px; margin-bottom: 20px;">Авторизуйтесь через Яндекс ID</p>
          <button class="btn-yandex" tabIndex="0" onclick="loginWithYandex()">Войти через Яндекс</button>
        `;
      }
    }
    function logoutYandex() {
      localStorage.removeItem('tv34_yandex_user');
      renderAuthHeader();
      renderAuthModalContent();
    }

    async function init() {
      checkYandexAuth();
      try {
        const res = await fetch('./playlist.m3u?v=' + Date.now());
        if (!res.ok) throw new Error("Плейлист не найден");
        const text = await res.text();
        
        const lines = text.split('\n');
        let current = null;
        lines.forEach(line => {
          line = line.trim();
          if (line.startsWith('#EXTINF:')) {
            const logoMatch = line.match(/tvg-logo="([^"]+)"/);
            const tvgIdMatch = line.match(/tvg-id="([^"]+)"/);
            const groupMatch = line.match(/group-title="([^"]+)"/);
            const nameParts = line.split(',');
            current = {
              logo: logoMatch ? logoMatch[1] : '',
              name: nameParts[nameParts.length - 1].trim(),
              group: groupMatch ? groupMatch[1] : 'Развлекательные',
              tvgId: tvgIdMatch ? tvgIdMatch[1] : null,
              url: ''
            };
          } else if (line && !line.startsWith('#') && current) {
            current.url = line;
            allChannels.push(current);
            current = null;
          }
        });

        const cached = await loadEpgFromCache();
        if (cached && (Date.now() - cached.savedAt) < EPG_MAX_AGE_MS) {
          epgData = { idByNormalizedName: cached.idByNormalizedName, programsByChannelId: cached.programsByChannelId };
        } else {
          const epgRes = await fetch(EPG_URL, { cache: 'no-store' });
          if(epgRes.ok) {
            const bytes = new Uint8Array(await epgRes.arrayBuffer());
            epgData = await parseEpgInWorker(bytes);
            saveEpgToCache(epgData);
          }
        }

        buildEpgMatches();
        renderChannels();
      } catch (e) {
        console.warn(e);
        document.getElementById('channelList').innerHTML = '<p style="color: #ff5d5d; padding: 20px;">Ошибка загрузки</p>';
      }
    }

    init();
  </script>
